<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>House of the Dragon - Semana do Zero ao Programador Contratado</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./src/css/reset.css">
    <link rel="stylesheet" href="./src/css/estilo.css">
    <link rel="stylesheet" href="./src/css/responsivo.css">
</head>

<body>
    <main>
        <div class="carrossel" aria-hidden="true"></div>

        <div class="conteudo">
            <div class="informacoes"></div>

            <div class="controles-carrossel">
                <button class="botao-anterior" type="button" aria-label="Exibir dragão anterior">
                    Anterior
                </button>

                <div class="botoes-carrossel"></div>

                <span
            class="contador-carrossel"
            aria-live="polite"></span>

                <button class="botao-proximo" type="button" aria-label="Exibir próximo dragão">
                    Próximo
                </button>
            </div>
        </div>
    </main>

    <script src="./src/js/index.js"></script>
